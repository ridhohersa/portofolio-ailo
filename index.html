<meta name="color-scheme" content="light dark">
<script>
/* Pasang tema sebelum halaman digambar, supaya tidak berkedip. Pilihan manual (localStorage) menang; tanpa pilihan, ikuti sistem. */
(function(){try{var t=localStorage.getItem("ailo-theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}})();
</script>
